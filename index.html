<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Diagnóstico Comercial — LXD Digital</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- META PIXEL — cole aqui -->
  <!-- GTM — cole aqui -->

  <style>
    :root {
      --bg:           #07090f;
      --card:         #0c0f1a;
      --border:       rgba(90, 120, 255, 0.16);
      --border-hover: rgba(90, 120, 255, 0.48);
      --accent:       #5a78ff;
      --accent2:      #8b5cf6;
      --text:         #eef0f8;
      --muted:        #6b7280;
      --success:      #34d399;
      --error:        #f87171;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100svh;
      display: grid;
      place-items: start center;
      padding: 28px 16px 40px;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 72% 0%,  rgba(90,120,255,.11) 0%, transparent 48%),
        radial-gradient(ellipse at 8%  85%, rgba(139,92,246,.09) 0%, transparent 42%),
        var(--bg);
      color: var(--text);
    }

    .shell { width: 100%; max-width: 620px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      overflow: hidden;
      box-shadow:
        0 40px 100px rgba(0,0,0,.55),
        inset 0 0 0 1px rgba(255,255,255,.03);
    }

    .header { padding: 32px 32px 24px; text-align: center; }

    .logo-text {
      display: inline-block;
      margin-bottom: 20px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .logo-text span {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 13px;
      background: rgba(90,120,255,.08);
      border: 1px solid rgba(90,120,255,.22);
      border-radius: 99px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }
    .badge::before {
      content: '';
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: blink 2.2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

    .header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(22px, 5vw, 34px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -.03em;
      margin-bottom: 10px;
    }
    .header p { color: var(--muted); font-size: 14px; line-height: 1.65; }

    .progress-wrap { padding: 0 32px; }
    .progress-track {
      height: 3px;
      background: rgba(255,255,255,.06);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: inherit;
      transition: width .4s cubic-bezier(.4,0,.2,1);
    }

    .body { padding: 26px 32px 32px; }

    .step-meta {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .step-meta .accent { color: var(--accent); }

    .body h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(17px, 3.8vw, 23px);
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: -.02em;
      margin-bottom: 20px;
    }

    .options { display: grid; gap: 8px; }

    .opt {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 13px 16px;
      background: rgba(255,255,255,.025);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #d4d7e8;
      font: 500 14px/1.4 'Inter', sans-serif;
      text-align: left;
      cursor: pointer;
      transition: border-color .15s, background .15s, transform .1s;
      word-break: break-word;
    }
    .opt:hover, .opt:focus { outline:none; border-color: var(--border-hover); background: rgba(90,120,255,.07); }
    .opt:active { transform: scale(.99); }

    .dot {
      flex: 0 0 15px;
      width: 15px; height: 15px;
      border: 1.5px solid rgba(90,120,255,.35);
      border-radius: 50%;
      transition: border-color .15s, background .15s;
    }
    .opt:hover .dot, .opt:focus .dot { border-color: var(--accent); background: rgba(90,120,255,.18); }

    .fields { display: grid; gap: 13px; }

    label.lbl {
      display: grid;
      gap: 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    input.inp, textarea.inp {
      width: 100%;
      padding: 13px 15px;
      background: rgba(255,255,255,.035);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font: 400 15px 'Inter', sans-serif;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      resize: none;
    }
    input.inp::placeholder, textarea.inp::placeholder { color: #2e3352; }
    input.inp:focus, textarea.inp:focus {
      border-color: rgba(90,120,255,.55);
      box-shadow: 0 0 0 3px rgba(90,120,255,.1);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 20px;
    }
    .btn-back {
      padding: 8px 2px;
      background: transparent;
      border: none;
      color: var(--muted);
      font: 700 11px 'Inter', sans-serif;
      letter-spacing: .07em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color .15s;
    }
    .btn-back:hover { color: var(--text); }

    .btn-submit {
      width: 100%;
      min-height: 56px;
      padding: 0 24px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 12px;
      color: #fff;
      font: 700 13px 'Space Grotesk', sans-serif;
      letter-spacing: .05em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 28px rgba(90,120,255,.3);
      transition: opacity .2s, transform .1s;
    }
    .btn-submit:hover { opacity: .88; }
    .btn-submit:active { transform: scale(.99); }
    .btn-submit:disabled { opacity: .4; cursor: not-allowed; }

    .err { margin-top: 10px; color: var(--error); font-size: 13px; text-align: center; line-height: 1.5; }

    .success {
      display: grid;
      place-items: center;
      gap: 16px;
      padding: 16px 0;
      text-align: center;
    }
    .check-icon {
      width: 72px; height: 72px;
      display: grid; place-items: center;
      border: 1px solid rgba(52,211,153,.4);
      border-radius: 50%;
      font-size: 28px;
      color: var(--success);
      background: rgba(52,211,153,.06);
    }
    .success h2 { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; }
    .success p { color: var(--muted); font-size: 14px; line-height: 1.7; max-width: 420px; }

    .footnote {
      text-align: center;
      margin-top: 16px;
      color: #2e3352;
      font-size: 12px;
    }

    @media (prefers-reduced-motion: no-preference) {
      .body { animation: fadeUp .28s ease both; }
      @keyframes fadeUp { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }
    }

    @media (max-width: 600px) {
      body { padding: 10px 8px 32px; align-items: start; }
      .card { border-radius: 16px; }
      .header { padding: 22px 18px 18px; }
      .progress-wrap { padding: 0 18px; }
      .body { padding: 20px 18px 24px; }
      .opt:hover, .opt:focus { transform: none; }
    }
    @media (max-width: 360px) {
      .header, .body { padding-inline: 14px; }
      .progress-wrap { padding-inline: 14px; }
    }
  </style>
</head>

<body>
  <div class="shell">
    <div class="card">
      <header class="header">
        <!-- <img src="seu-logo.png" alt="LXD Digital" style="height:48px;margin-bottom:20px;display:block;margin-inline:auto;"> -->
        <div class="logo-text">LXD<span>Digital</span></div>
        <div class="badge">Aplicação — Diagnóstico Comercial</div>
        <h1>Descubra onde sua operação comercial está perdendo oportunidades</h1>
        <p>Analisamos cada aplicação antes de liberar o próximo passo. São poucas vagas por ciclo.</p>
      </header>

      <div class="progress-wrap">
        <div class="progress-track">
          <div class="progress-fill" id="pfill"></div>
        </div>
      </div>

      <main class="body" id="fbody" aria-live="polite"></main>
    </div>
    <p class="footnote">Seus dados são confidenciais e não serão compartilhados.</p>
  </div>

<script>
// ================================================================
//  CONFIGURAÇÃO — substitua pela URL do seu novo Apps Script
// ================================================================
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwHTnjG4651EV8tkFFvCOoVtPU8sRjERwZQfi4USsYIv4FZaM11XwSnH-07av9sdyFAiQ/exec';
// ================================================================

const QS = [
  {
    id: 'faturamento',
    q: 'Qual é o faturamento médio mensal da empresa?',
    opts: [
      { l: 'Até R$ 20 mil',              s: 0 },
      { l: 'R$ 20 mil a R$ 50 mil',      s: 1 },
      { l: 'R$ 50 mil a R$ 100 mil',     s: 2 },
      { l: 'R$ 100 mil a R$ 300 mil',    s: 3 },
      { l: 'R$ 300 mil a R$ 1 milhão',   s: 4 },
      { l: 'Acima de R$ 1 milhão',       s: 5 },
    ]
  },
  {
    id: 'leads_mes',
    q: 'Quantos leads ou oportunidades comerciais entram, aproximadamente, por mês?',
    opts: [
      { l: 'Menos de 30',    s: 0 },
      { l: '30 a 100',       s: 1 },
      { l: '101 a 300',      s: 2 },
      { l: '301 a 1.000',    s: 3 },
      { l: 'Mais de 1.000',  s: 4 },
      { l: 'Não sei',        s: 1 },
    ]
  },
  {
    id: 'responsavel',
    q: 'Quem é responsável por atender e vender para esses leads hoje?',
    opts: [
      { l: 'Eu mesmo',                    s: 1 },
      { l: 'Atendimento / secretária',    s: 1 },
      { l: '1 vendedor',                  s: 2 },
      { l: 'Time comercial',              s: 3 },
      { l: 'Agência / terceirizado',      s: 1 },
      { l: 'Não existe responsável definido', s: 0 },
    ]
  },
  {
    id: 'problema',
    q: 'Qual destes problemas mais acontece hoje na sua operação?',
    opts: [
      { l: 'Leads demoram ou ficam sem resposta',        s: 0 },
      { l: 'Leads e clientes antigos não são reativados', s: 0 },
      { l: 'Propostas ficam sem follow-up',              s: 0 },
      { l: 'Temos muitos no-shows',                      s: 0 },
      { l: 'Falta acompanhamento e gestão comercial',    s: 0 },
      { l: 'Não sei onde está o principal gargalo',      s: 0 },
    ]
  },
  {
    id: 'crm',
    q: 'Vocês utilizam CRM ou algum processo estruturado de acompanhamento comercial?',
    opts: [
      { l: 'Sim, e utilizamos bem',             s: 2 },
      { l: 'Sim, mas pouco',                    s: 1 },
      { l: 'Temos CRM, mas está desorganizado', s: 1 },
      { l: 'Não utilizamos CRM',                s: 0 },
      { l: 'Não sei',                           s: 0 },
    ]
  },
  {
    id: 'decisor',
    q: 'Você participa da decisão sobre investimentos comerciais da empresa?',
    opts: [
      { l: 'Sim, decido sozinho',          s: 3 },
      { l: 'Sim, decido com sócio / time', s: 2 },
      { l: 'Não sou o decisor',            s: 0 },
    ]
  },
  {
    id: 'prazo',
    q: 'Se identificarmos fit, quando você gostaria de começar o Diagnóstico e Arquitetura?',
    opts: [
      { l: 'Imediatamente',           s: 3 },
      { l: 'Nos próximos 15 dias',    s: 2 },
      { l: 'Nos próximos 30 dias',    s: 1 },
      { l: 'Estou apenas pesquisando', s: 0 },
    ]
  },
  {
    id: 'investimento',
    q: 'O Diagnóstico e Arquitetura tem investimento de R$ 2.900 — creditado integralmente caso avance para a fase de Instalação. Se sua aplicação for aprovada, esse valor está dentro do que você considera viável?',
    opts: [
      { l: 'Sim',                                      s: 4 },
      { l: 'Sim, se eu entender melhor a proposta',    s: 2 },
      { l: 'Preciso avaliar com outra pessoa',         s: 1 },
      { l: 'Não neste momento',                        s: 0 },
    ]
  }
];

const ST = { step: 0, ans: {}, scores: {}, sending: false };

function getUTMs() {
  const p = new URLSearchParams(location.search);
  const keys = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','gclid','fbclid'];
  let saved = {};
  try { saved = JSON.parse(sessionStorage.getItem('lxd-utm-comercial') || '{}'); } catch {}
  const d = {};
  keys.forEach(k => { d[k] = p.get(k) || saved[k] || ''; });
  d.referrer     = saved.referrer     || document.referrer || '';
  d.landing_page = saved.landing_page || location.href;
  try { sessionStorage.setItem('lxd-utm-comercial', JSON.stringify(d)); } catch {}
  return d;
}
const UTM = getUTMs();

const $body = document.getElementById('fbody');
const $fill  = document.getElementById('pfill');

// Max possível: 5+4+3+0+2+3+3+4 = 24
function totalScore() { return Object.values(ST.scores).reduce((a,b) => a+b, 0); }
function classify(s) {
  if (s >= 13) return '🔥 Alta prioridade';
  if (s >= 6)  return '🟡 Potencial';
  return '⚪ Baixa prioridade';
}

function track(name, data = {}) {
  try { if (window.dataLayer) window.dataLayer.push({ event: name, ...data }); } catch {}
  try { if (window.fbq) window.fbq('trackCustom', name, data); } catch {}
}

function render() {
  $fill.style.width = Math.round((ST.step / (QS.length + 1)) * 100) + '%';
  track('form_step', { step: ST.step, total: QS.length });
  ST.step < QS.length ? renderQ() : renderContact();
}

function renderQ() {
  const q = QS[ST.step];
  $body.innerHTML = `
    <div class="step-meta">
      <span class="accent">Etapa ${ST.step + 1}</span>
      <span>${ST.step + 1} de ${QS.length}</span>
    </div>
    <h2>${safe(q.q)}</h2>
    <div class="options" id="opts"></div>
    ${ST.step > 0 ? `<div class="nav"><button class="btn-back" type="button">← Voltar</button></div>` : ''}
  `;
  const grid = $body.querySelector('#opts');
  q.opts.forEach(o => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'opt';
    btn.innerHTML = `<span class="dot"></span><span>${safe(o.l)}</span>`;
    btn.onclick = () => {
      ST.ans[q.id]    = o.l;
      ST.scores[q.id] = o.s;
      ST.step++;
      render();
    };
    grid.appendChild(btn);
  });
  const bk = $body.querySelector('.btn-back');
  if (bk) bk.onclick = () => { ST.step--; render(); };
}

function renderContact() {
  $fill.style.width = Math.round((QS.length / (QS.length + 1)) * 100) + '%';
  $body.innerHTML = `
    <div class="step-meta">
      <span class="accent">Última etapa</span>
      <span>Seus dados</span>
    </div>
    <h2>Para onde enviamos o retorno da sua aplicação?</h2>
    <div class="fields">
      <label class="lbl">Nome completo
        <input class="inp" name="nome"     type="text"  required minlength="3" autocomplete="name" placeholder="Como você se chama">
      </label>
      <label class="lbl">WhatsApp com DDD
        <input class="inp" name="whatsapp" type="tel"   required minlength="10" autocomplete="tel" inputmode="tel" placeholder="(11) 99999-0000">
      </label>
      <label class="lbl">E-mail profissional
        <input class="inp" name="email"    type="email" required autocomplete="email" placeholder="voce@empresa.com">
      </label>
      <label class="lbl">Nome da empresa
        <input class="inp" name="empresa"  type="text"  required minlength="2" placeholder="Nome da sua empresa">
      </label>
      <label class="lbl">Segmento de atuação
        <input class="inp" name="segmento" type="text"  required placeholder="Ex: Clínica médica, Escritório de advocacia...">
      </label>
      <button class="btn-submit" type="button" id="bsend">Enviar minha aplicação →</button>
      <p class="err" id="ferr" hidden></p>
    </div>
    <div class="nav"><button class="btn-back" type="button">← Voltar</button></div>
  `;
  $body.querySelector('.btn-back').onclick = () => { ST.step--; render(); };
  $body.querySelector('#bsend').onclick = doSubmit;
}

async function doSubmit() {
  if (ST.sending) return;
  const fields = $body.querySelectorAll('.inp');
  let ok = true;
  const vals = {};
  fields.forEach(f => {
    const v = f.value.trim();
    if (f.required && !v) { f.focus(); ok = false; }
    if (f.type === 'email' && v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { f.focus(); ok = false; }
    vals[f.name] = v;
  });
  if (!ok) { showErr('Preencha todos os campos obrigatórios antes de continuar.'); return; }
  if (!GAS_URL || GAS_URL.includes('COLE_AQUI')) {
    showErr('⚠️ Configure a URL do Apps Script antes de publicar.');
    return;
  }

  const score = totalScore();
  const label = classify(score);

  const payload = {
    data:        new Date().toISOString(),
    nome:        vals.nome,
    whatsapp:    vals.whatsapp,
    email:       vals.email,
    empresa:     vals.empresa,
    segmento:    vals.segmento,
    faturamento: ST.ans.faturamento  || '',
    leads_mes:   ST.ans.leads_mes    || '',
    responsavel: ST.ans.responsavel  || '',
    problema:    ST.ans.problema     || '',
    crm:         ST.ans.crm          || '',
    decisor:     ST.ans.decisor      || '',
    prazo:       ST.ans.prazo        || '',
    investimento:ST.ans.investimento || '',
    lead_score:  score,
    classificacao: label,
    utm_source:   UTM.utm_source,
    utm_medium:   UTM.utm_medium,
    utm_campaign: UTM.utm_campaign,
    utm_content:  UTM.utm_content,
    utm_term:     UTM.utm_term,
    gclid:        UTM.gclid,
    fbclid:       UTM.fbclid,
    referrer:     UTM.referrer,
    pagina:       UTM.landing_page
  };

  ST.sending = true;
  const btn = $body.querySelector('#bsend');
  btn.disabled = true;
  btn.textContent = 'Enviando...';
  hideErr();

  fetch(GAS_URL, {
    method: 'POST',
    mode:   'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).catch(() => {});

  setTimeout(() => {
    $fill.style.width = '100%';
    track('form_complete', { score, label });
    renderSuccess();
  }, 800);
}

function renderSuccess() {
  $body.innerHTML = `
    <div class="success">
      <div class="check-icon">✓</div>
      <h2>Aplicação recebida.</h2>
      <p>Vamos analisar as informações da sua empresa.<br>Caso exista fit para o Diagnóstico e Arquitetura, você receberá o próximo passo para agendamento.</p>
    </div>
  `;
}

function showErr(m) { const e = $body.querySelector('#ferr'); if (e) { e.hidden=false; e.textContent=m; } }
function hideErr()  { const e = $body.querySelector('#ferr'); if (e) e.hidden=true; }
function safe(v)    { return String(v||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }

track('form_start');
render();
</script>
</body>
</html>
